[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eeg-emostudio"
version = "0.5.0"
description = "Data curation and model training workbench for EEG-based emotion recognition"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "EEG-EmoStudio project" }]
license = { text = "Research use only; see the project README" }
dependencies = [
  "numpy>=2.0,<3",
  "scipy>=1.11,<2",
  "pandas>=2.0,<3",
  "matplotlib>=3.8,<4",
  "scikit-learn>=1.4,<2",
  "torch>=2.1,<3",
  "openpyxl>=3.1,<4",
  "fastapi>=0.110,<1",
  "uvicorn>=0.29,<1",
  "jinja2>=3.1,<4",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
media = ["opencv-python>=4.9", "av>=12"]
mne = ["mne>=1.6"]
dev = ["pytest>=8"]

[project.scripts]
eeg-emostudio = "eeg_emostudio.cli:main"
eeg-emostudio-web = "webapp.__main__:main"

[tool.setuptools.packages.find]
include = ["eeg_emostudio*", "webapp*"]

[tool.setuptools.package-data]
webapp = ["templates/*.html", "static/js/*.js", "static/css/*.css", "db_schema/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
